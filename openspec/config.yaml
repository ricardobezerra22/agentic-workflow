schema: spec-driven

context: |
  Next.js 16 + TypeScript + Prisma + Tailwind v4 + Radix UI production-grade
  task management application. Full stack: Server Components by default,
  Client Components for interactivity. Tailwind with custom design tokens
  (CSS variables, light/dark mode ready). Radix UI primitives for accessible
  components. Full accessibility (WCAG 2.1 AA). REST API with Prisma ORM,
  PostgreSQL database. Comprehensive testing infrastructure: Vitest for unit/integration,
  Playwright for E2E. Every behavior in a spec scenario must have a matching test.
  `npm run lint && npm test && npm run build` must pass before a change is considered done.

rules:
  tasks:
    - Write the failing test for a task before the implementation (TDD)
    - Keep each task small enough to finish in one commit
    - Every new behavior must have unit + integration + e2e tests (see .claude/rules.md)
  proposal:
    - Every proposal.md must include a "## Decision Log" section
    - Each entry: "**<choice made>** — why this over <alternative>; ceiling: <known limitation>"
    - At minimum one entry per non-obvious design choice (data model, auth, infra, library pick)
