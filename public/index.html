<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo List</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f0f2f5;
  --surface: #fff;
  --border: #e2e8f0;
  --text: #1a202c;
  --muted: #718096;
  --accent: #4f6ef7;
  --accent-hover: #3b58e0;
  --danger: #e53e3e;
  --danger-hover: #c53030;
  --overdue: #c53030;
  --overdue-bg: #fff5f5;
  --radius: 10px;
  --shadow: 0 1px 4px rgba(0,0,0,.08);
}

body {
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 2rem 1rem;
}

.container { max-width: 680px; margin: 0 auto; }

h1 {
  font-size: 1.4rem;
  font-weight: 700;
  margin-bottom: 1.5rem;
  display: flex;
  align-items: center;
  gap: .5rem;
}
h1::before { content: "✓"; color: var(--accent); }

/* ── Cards ── */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 1.25rem;
  box-shadow: var(--shadow);
  margin-bottom: 1rem;
  border: 1px solid var(--border);
}

/* ── Form ── */
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: .75rem;
}
.form-grid .span-2 { grid-column: 1 / -1; }

label {
  display: block;
  font-size: .75rem;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .04em;
  margin-bottom: .3rem;
}

input, select, textarea {
  width: 100%;
  padding: .5rem .7rem;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  font: inherit;
  font-size: .9rem;
  background: var(--surface);
  color: var(--text);
  transition: border-color .15s;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(79,110,247,.12);
}
textarea { resize: vertical; min-height: 64px; }

/* ── Buttons ── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
  padding: .5rem 1rem;
  border: none;
  border-radius: 6px;
  font: inherit;
  font-size: .875rem;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s, transform .1s;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--border); }
.btn-ghost:hover { background: var(--bg); color: var(--text); }
.btn-danger { background: transparent; color: var(--danger); border: 1.5px solid #fed7d7; font-size: .8rem; padding: .35rem .7rem; }
.btn-danger:hover { background: var(--overdue-bg); }
.btn-sm { font-size: .8rem; padding: .35rem .7rem; }

/* ── Filters ── */
.filters {
  display: flex;
  gap: .6rem;
  flex-wrap: wrap;
  align-items: flex-end;
}
.filters .filter-group { display: flex; flex-direction: column; min-width: 110px; }
.filters .filter-search { flex: 1; min-width: 160px; }

/* ── Task list ── */
.task-list { list-style: none; }

.task-item {
  display: grid;
  grid-template-columns: 1.2rem 1fr auto;
  gap: .75rem;
  align-items: start;
  padding: .9rem 0;
  border-bottom: 1px solid var(--border);
  transition: background .1s;
}
.task-item:last-child { border-bottom: none; }

.task-item input[type="checkbox"] {
  width: 1.1rem;
  height: 1.1rem;
  margin-top: .2rem;
  cursor: pointer;
  accent-color: var(--accent);
  flex-shrink: 0;
}

.task-body { min-width: 0; }

.task-title {
  font-weight: 600;
  font-size: .95rem;
  word-break: break-word;
  line-height: 1.4;
}
.task-title.done {
  text-decoration: line-through;
  color: var(--muted);
}

.task-meta {
  display: flex;
  flex-wrap: wrap;
  gap: .4rem;
  align-items: center;
  margin-top: .35rem;
}

.badge {
  display: inline-flex;
  align-items: center;
  font-size: .7rem;
  font-weight: 700;
  padding: .15rem .45rem;
  border-radius: 4px;
  text-transform: uppercase;
  letter-spacing: .03em;
}
.badge-low    { background: #c6f6d5; color: #276749; }
.badge-medium { background: #fef3c7; color: #92400e; }
.badge-high   { background: #fed7d7; color: #9b2c2c; }
.badge-overdue { background: #fed7d7; color: var(--overdue); }
.badge-date   { background: var(--bg); color: var(--muted); border: 1px solid var(--border); }

.task-item.overdue .task-title { color: var(--overdue); }

.task-actions {
  display: flex;
  flex-direction: column;
  gap: .3rem;
  align-items: flex-end;
  flex-shrink: 0;
}

/* ── Inline edit ── */
.edit-form {
  display: none;
  margin-top: .75rem;
  padding-top: .75rem;
  border-top: 1px dashed var(--border);
}
.edit-form.open {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: .6rem;
}
.edit-form .span-2 { grid-column: 1 / -1; }
.edit-actions {
  grid-column: 1 / -1;
  display: flex;
  gap: .5rem;
}

/* ── Empty / error ── */
.empty {
  text-align: center;
  color: var(--muted);
  padding: 3rem 1rem;
  font-size: .9rem;
}
.empty-icon { font-size: 2rem; display: block; margin-bottom: .5rem; }

.error-banner {
  background: var(--overdue-bg);
  border: 1px solid #fc8181;
  color: var(--overdue);
  padding: .75rem 1rem;
  border-radius: 8px;
  margin-bottom: 1rem;
  font-size: .875rem;
  display: none;
}
.error-banner.visible { display: block; }

/* ── Count ── */
.task-count {
  font-size: .8rem;
  color: var(--muted);
  margin-bottom: .5rem;
}

@media (max-width: 480px) {
  .form-grid, .edit-form.open { grid-template-columns: 1fr; }
  .form-grid .span-2, .edit-form .span-2 { grid-column: 1; }
  .filters { flex-direction: column; }
  .filters .filter-group, .filters .filter-search { min-width: 0; width: 100%; }
}
</style>
</head>
<body>
<div class="container">

<h1>Lista de Tarefas</h1>

<div id="error-banner" class="error-banner" role="alert" aria-live="polite"></div>

<div class="card">
  <form id="create-form" novalidate>
    <div class="form-grid">
      <div class="span-2">
        <label for="new-title">Título *</label>
        <input id="new-title" type="text" required maxlength="200" placeholder="O que precisa de fazer?" autocomplete="off">
      </div>
      <div class="span-2">
        <label for="new-desc">Descrição</label>
        <textarea id="new-desc" maxlength="2000" placeholder="Opcional..."></textarea>
      </div>
      <div>
        <label for="new-priority">Prioridade</label>
        <select id="new-priority">
          <option value="low">Baixa</option>
          <option value="medium" selected>Média</option>
          <option value="high">Alta</option>
        </select>
      </div>
      <div>
        <label for="new-due">Data limite</label>
        <input id="new-due" type="date">
      </div>
      <div class="span-2">
        <button type="submit" class="btn btn-primary">+ Adicionar tarefa</button>
      </div>
    </div>
  </form>
</div>

<div class="card">
  <div class="filters">
    <div class="filter-group">
      <label for="f-status">Estado</label>
      <select id="f-status">
        <option value="all">Todos</option>
        <option value="open">Abertas</option>
        <option value="done">Concluídas</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="f-priority">Prioridade</label>
      <select id="f-priority">
        <option value="">Todas</option>
        <option value="low">Baixa</option>
        <option value="medium">Média</option>
        <option value="high">Alta</option>
      </select>
    </div>
    <div class="filter-search">
      <label for="f-q">Pesquisa</label>
      <input id="f-q" type="search" placeholder="Filtrar tarefas...">
    </div>
  </div>
</div>

<div class="card">
  <div id="task-count" class="task-count"></div>
  <ul id="task-list" class="task-list" aria-label="Tarefas"></ul>
</div>

</div><!-- .container -->
<script>
// ── Constants ────────────────────────────────────────────────────────────────

const API = "/api/tasks";

const PRIORITY = {
  low:    { label: "Baixa",  cls: "badge-low" },
  medium: { label: "Média",  cls: "badge-medium" },
  high:   { label: "Alta",   cls: "badge-high" },
};

// ── State ────────────────────────────────────────────────────────────────────

const state = { tasks: [], editingId: null };

function setState(patch) {
  Object.assign(state, patch);
  render();
}

// ── Utils ────────────────────────────────────────────────────────────────────

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "cls")        node.className = v;
      else if (k === "text")  node.textContent = v;
      else if (k === "on")    Object.entries(v).forEach(([e, fn]) => node.addEventListener(e, fn));
      else                    node[k] = v;
    }
  }
  node.append(...children);
  return node;
}

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

function todayStr() {
  return new Date().toLocaleDateString("sv"); // YYYY-MM-DD in local time
}

function isOverdue(task) {
  return !task.completed && task.dueDate && task.dueDate < todayStr();
}

// ── API ──────────────────────────────────────────────────────────────────────

async function apiFetch(path, opts = {}) {
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    method: opts.method || "GET",
    body: opts.body != null ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 204) return null;
  const json = await res.json();
  if (!res.ok) throw new Error(json.error?.message || "Erro desconhecido");
  return json;
}

// ── Error banner ─────────────────────────────────────────────────────────────

function showError(msg) {
  const banner = document.getElementById("error-banner");
  banner.textContent = msg;
  banner.classList.add("visible");
}

function clearError() {
  const banner = document.getElementById("error-banner");
  banner.textContent = "";
  banner.classList.remove("visible");
}

// ── Data loading ─────────────────────────────────────────────────────────────

async function loadTasks() {
  clearError();
  const params = new URLSearchParams();
  const status   = document.getElementById("f-status").value;
  const priority = document.getElementById("f-priority").value;
  const q        = document.getElementById("f-q").value.trim();
  if (status !== "all") params.set("status", status);
  if (priority)         params.set("priority", priority);
  if (q)                params.set("q", q);

  try {
    const tasks = await apiFetch(API + (params.size ? "?" + params : ""));
    setState({ tasks });
  } catch (err) {
    showError("Não foi possível carregar as tarefas: " + err.message);
  }
}

// ── Builders ─────────────────────────────────────────────────────────────────

function buildMeta(task) {
  const meta = el("div", { cls: "task-meta" });
  const { label, cls } = PRIORITY[task.priority] || PRIORITY.medium;
  meta.append(el("span", { cls: "badge " + cls, text: label }));
  if (task.dueDate) meta.append(el("span", { cls: "badge badge-date", text: "📅 " + task.dueDate }));
  if (isOverdue(task)) meta.append(el("span", { cls: "badge badge-overdue", text: "Em atraso" }));
  return meta;
}

function buildEditForm(task) {
  const titleInput = el("input", { type: "text", maxLength: 200, value: task.title, id: "et-" + task.id });
  const priSel     = el("select", { id: "ep-" + task.id });
  const dateInput  = el("input", { type: "date", value: task.dueDate || "", id: "ed-" + task.id });

  for (const [v, { label }] of Object.entries(PRIORITY)) {
    priSel.append(el("option", { value: v, text: label, selected: v === task.priority }));
  }

  const save = el("button", {
    cls: "btn btn-primary btn-sm", text: "Guardar", type: "button",
    on: { click: () => saveEdit(task.id, titleInput.value, priSel.value, dateInput.value || null) },
  });
  const cancel = el("button", {
    cls: "btn btn-ghost btn-sm", text: "Cancelar", type: "button",
    on: { click: () => setState({ editingId: null }) },
  });

  const form = el("div", { cls: "edit-form" + (state.editingId === task.id ? " open" : "") });
  form.append(
    el("div", { cls: "span-2" }, el("label", { htmlFor: "et-" + task.id, text: "Título" }), titleInput),
    el("div", {}, el("label", { htmlFor: "ep-" + task.id, text: "Prioridade" }), priSel),
    el("div", {}, el("label", { htmlFor: "ed-" + task.id, text: "Data limite" }), dateInput),
    el("div", { cls: "edit-actions" }, save, cancel),
  );
  return form;
}

function buildTaskItem(task) {
  const overdue = isOverdue(task);
  const li = el("li", { cls: "task-item" + (overdue ? " overdue" : "") });

  const cb = el("input", {
    type: "checkbox", checked: task.completed,
    on: { change: (e) => toggleComplete(task.id, e.target.checked) },
  });
  cb.setAttribute("aria-label", "Concluir: " + task.title);

  const title = el("span", { cls: "task-title" + (task.completed ? " done" : ""), text: task.title });

  const editBtn = el("button", {
    cls: "btn btn-ghost btn-sm", text: "Editar",
    on: { click: () => setState({ editingId: state.editingId === task.id ? null : task.id }) },
  });
  editBtn.setAttribute("aria-expanded", String(state.editingId === task.id));

  const delBtn = el("button", {
    cls: "btn btn-danger btn-sm", text: "Apagar",
    on: { click: () => deleteTask(task.id, task.title) },
  });

  const body = el("div", { cls: "task-body" }, title, buildMeta(task), buildEditForm(task));
  const actions = el("div", { cls: "task-actions" }, editBtn, delBtn);

  li.append(cb, body, actions);
  return li;
}

// ── Render ───────────────────────────────────────────────────────────────────

function render() {
  const list  = document.getElementById("task-list");
  const count = document.getElementById("task-count");

  if (!state.tasks.length) {
    list.replaceChildren(
      el("li", { cls: "empty" },
        el("span", { cls: "empty-icon", text: "🗒️" }),
        el("span", { text: "Sem tarefas." }),
      )
    );
    count.textContent = "";
    return;
  }

  const open = state.tasks.filter(t => !t.completed).length;
  count.textContent = open + " abertas · " + state.tasks.length + " total";
  list.replaceChildren(...state.tasks.map(buildTaskItem));
}

// ── Actions ──────────────────────────────────────────────────────────────────

async function toggleComplete(id, completed) {
  try {
    await apiFetch(API + "/" + id, { method: "PATCH", body: { completed } });
    await loadTasks();
  } catch (err) {
    showError("Erro ao atualizar: " + err.message);
    await loadTasks(); // revert
  }
}

async function saveEdit(id, title, priority, dueDate) {
  try {
    await apiFetch(API + "/" + id, { method: "PATCH", body: { title, priority, dueDate } });
    setState({ editingId: null });
    await loadTasks();
  } catch (err) {
    showError("Erro ao guardar: " + err.message);
  }
}

async function deleteTask(id, title) {
  if (!confirm('Apagar "' + title + '"?')) return;
  try {
    await apiFetch(API + "/" + id, { method: "DELETE" });
    await loadTasks();
  } catch (err) {
    showError("Erro ao apagar: " + err.message);
  }
}

// ── Create form ──────────────────────────────────────────────────────────────

document.getElementById("create-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const title = document.getElementById("new-title").value.trim();
  if (!title) {
    showError("O título é obrigatório.");
    document.getElementById("new-title").focus();
    return;
  }
  try {
    await apiFetch(API, {
      method: "POST",
      body: {
        title,
        description: document.getElementById("new-desc").value || null,
        priority:    document.getElementById("new-priority").value,
        dueDate:     document.getElementById("new-due").value || null,
      },
    });
    e.target.reset();
    document.getElementById("new-priority").value = "medium";
    await loadTasks();
  } catch (err) {
    showError("Erro ao criar tarefa: " + err.message);
  }
});

// ── Filter listeners ─────────────────────────────────────────────────────────

document.getElementById("f-status").addEventListener("change", loadTasks);
document.getElementById("f-priority").addEventListener("change", loadTasks);
document.getElementById("f-q").addEventListener("input", debounce(loadTasks, 300));

// ── Boot ─────────────────────────────────────────────────────────────────────

loadTasks();
</script>
</body>
</html>
