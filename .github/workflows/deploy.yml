name: Deploy

# Preview deploy on every PR, production deploy when CI passes on main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: todo_test
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
        options: >-
          --health-cmd "pg_isready -U todo"
          --health-interval 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://todo:todo@localhost:5432/todo_test
        run: npm test
      - run: npx vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - id: deploy
        run: echo "url=$(npx vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Preview: ${{ steps.deploy.outputs.url }}`,
            });

  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: todo_test
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
        options: >-
          --health-cmd "pg_isready -U todo"
          --health-interval 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://todo:todo@localhost:5432/todo_test
        run: npm test
      - run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Notify blog post API
        env:
          BLOG_POST_API_KEY: ${{ secrets.BLOG_POST_API_KEY }}
          BLOG_POST_API_URL: ${{ vars.BLOG_POST_API_URL }}
          GH_SHA: ${{ github.sha }}
          GH_REF: ${{ github.ref }}
          GH_ACTOR: ${{ github.actor }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_DEPLOYED_AT: ${{ github.event.head_commit.timestamp }}
        run: |
          python3 - <<'EOF'
          import re, json, os, datetime
          from urllib.request import Request, urlopen

          changelog = open('CHANGELOG.md').read()
          section = re.search(r'## \[Unreleased\](.*?)(?=\n## |\Z)', changelog, re.DOTALL)
          entries = []
          if section:
              for line in section.group(1).strip().splitlines():
                  line = line.strip().lstrip('- ')
                  if not line:
                      continue
                  m = re.match(r'\*\*(.+?)\*\*\s+(?:\w+:\s+)?(.+?)\s*(?:\(`.+?`\).*)?$', line)
                  if m:
                      label, msg = m.group(1), m.group(2)
                      entries.append(f'{label}: {msg[0].upper()}{msg[1:]}')

          deployed_at = os.environ['GH_DEPLOYED_AT']
          repo = os.environ['GH_REPO']
          date = datetime.datetime.fromisoformat(deployed_at.replace('Z', '+00:00'))
          repo_name = repo.split('/')[-1].replace('-', ' ').title()

          payload = {
              'title': f"{repo_name} — What shipped {date.strftime('%b %-d, %Y')}",
              'slug': f"{repo.split('/')[-1]}-{date.strftime('%Y-%m-%d')}",
              'content': '\n'.join(f'- {e}' for e in entries),
              'published': True,
              'sha': os.environ['GH_SHA'],
              'ref': os.environ['GH_REF'],
              'actor': os.environ['GH_ACTOR'],
              'repo': repo,
              'run_url': f"https://github.com/{repo}/actions/runs/{os.environ['GH_RUN_ID']}",
              'deployed_at': deployed_at,
          }

          req = Request(
              os.environ['BLOG_POST_API_URL'],
              data=json.dumps(payload).encode(),
              headers={'x-api-key': os.environ['BLOG_POST_API_KEY'], 'Content-Type': 'application/json'},
              method='POST',
          )
          with urlopen(req) as resp:
              print(resp.read().decode())
          EOF
