name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Security & Performance Review
        id: review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REVIEW_FAIL_BELOW: D
        run: node scripts/ci-review.mjs | tee /tmp/review-output.txt

      - name: Post review comment
        if: always() && steps.review.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BODY=$(cat /tmp/review-output.txt)
          gh pr comment "$PR_NUMBER" --body "$(printf '### CI Code Review\n\n```\n%s\n```' "$BODY")"

      - name: PR Summary
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/pr-summary.mjs

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: todo_test
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
        options: >-
          --health-cmd "pg_isready -U todo"
          --health-interval 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        id: test
        env:
          TEST_DATABASE_URL: postgres://todo:todo@localhost:5432/todo_test
        run: npm test 2>&1 | tee /tmp/test-output.txt; exit ${PIPESTATUS[0]}

      - name: Explain test failures
        if: failure() && github.event_name == 'pull_request' && steps.test.outcome == 'failure'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/test-explainer.mjs /tmp/test-output.txt

      - name: Build
        run: npm run build

      - name: Validate OpenSpec
        run: npx --yes @fission-ai/openspec validate --all --strict

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
